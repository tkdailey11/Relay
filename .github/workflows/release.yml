name: Release

# Cutting a release is the same command CI runs and a laptop runs: Scripts/Release.sh. This
# workflow only supplies credentials and a cached libghostty.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # The signing certificate and notarization key live in the Prod environment's secrets.
    environment: Prod
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, and the version's patch number comes from the
          # existing release tags, so both need full history and tags.
          fetch-depth: 0

      - name: Choose the version
        run: |
          set -euo pipefail
          series="$(tr -d '[:space:]' < VERSION)"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # A pushed tag names the version itself, but must belong to VERSION's series so a
            # build is never labelled two different ways.
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^${series//./\\.}\.[0-9]+$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not a release of VERSION ($series), e.g. v$series.1." >&2
              exit 1
            fi
          else
            version="$(Scripts/Version.sh)"
          fi
          echo "RELAY_VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $version"

      - name: Select Xcode
        run: |
          set -euo pipefail
          # The image's default is already Xcode 26; pick the newest explicitly so an image
          # refresh that adds a beta alongside it cannot change the SDK under us. The libghostty
          # step ignores this and picks its own older SDK; see Docs/RELEASING.md.
          sudo xcode-select -switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # libghostty is pinned by version and checksum in BuildGhostty.sh, so its output is
      # reproducible and safe to reuse until that script changes.
      - name: Cache libghostty
        id: ghostty
        uses: actions/cache@v4
        with:
          path: |
            Packages/TerminalKit/Vendor
            Packages/TerminalKit/Sources/TerminalKit/Resources/ghostty
            Packages/TerminalKit/Sources/TerminalKit/Resources/terminfo
          key: libghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/BuildGhostty.sh') }}

      - name: Install Zig 0.14.1
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url=https://ziglang.org/download/0.14.1/zig-aarch64-macos-0.14.1.tar.xz
          expected=39f3dc5e79c22088ce878edc821dedb4ca5a1cd9f5ef915e9b3cc3053e8faefa
          curl --fail --location --retry 3 "$url" -o zig.tar.xz
          printf '%s  %s\n' "$expected" zig.tar.xz | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"

      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: Scripts/BuildGhostty.sh

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/relay-signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, notarize and staple
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          export AC_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_BASE64" | base64 --decode > "$AC_API_KEY_PATH"
          trap 'rm -f "$AC_API_KEY_PATH"' EXIT
          Scripts/Release.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$RELAY_VERSION"
          build="$(git rev-list --count HEAD)"
          zip=".build/release/Relay-$version.zip"
          tag="v$version"
          args=(--title "Relay $version" --notes "Relay $version (build $build), Apple Silicon, notarized.

          Requires macOS 26 or newer.")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Push the tag now rather than letting gh create it: a draft release has no tag until
            # it is published, and Scripts/Version.sh counts tags to pick the next patch number.
            # Tags pushed with the workflow token do not start this workflow again.
            git tag "$tag"
            git push origin "$tag"
            if [[ "${{ inputs.draft }}" == "true" ]]; then
              args+=(--draft)
            fi
          fi
          gh release create "$tag" "$zip" "${args[@]}"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/relay-signing.keychain-db" || true
